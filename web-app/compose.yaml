name: vibicle-foundation
services:
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run Initialize-Dev.ps1}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run Initialize-Dev.ps1}
      POSTGRES_DB: ${POSTGRES_DB:?Run Initialize-Dev.ps1}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      TZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
