name: vibicle-production-like
x-service-logging: &service-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"
x-db-env: &db-env
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-vibicle}
  API_ENV: production
  PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in deployment env}
services:
  db:
    image: postgres:18.6-bookworm
    logging: *service-logging
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vibicle_migrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a database password}
      POSTGRES_DB: ${POSTGRES_DB:-vibicle}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    image: vibicle-api:local
    logging: *service-logging
    build: ./backend
    command: ["python", "-m", "vibicle_api.provision"]
    environment:
      <<: *db-env
      POSTGRES_USER: ${POSTGRES_USER:-vibicle_migrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a database password}
      RUNTIME_PASSWORD: ${RUNTIME_PASSWORD:?Set an independent runtime password}
    depends_on:
      db:
        condition: service_healthy
    networks: [database]
  api:
    image: vibicle-api:local
    logging: *service-logging
    build: ./backend
    environment:
      <<: *db-env
      POSTGRES_USER: vibicle_runtime
      POSTGRES_PASSWORD: ${RUNTIME_PASSWORD:?Set an independent runtime password}
      RATE_LIMIT_SECRET: ${RATE_LIMIT_SECRET:?Set an independent rate limit secret}
      PRIVATE_IMAGE_ROOT: /data/images
      FORWARDED_ALLOW_IPS: ${GATEWAY_PROXY_IP:-172.31.254.2}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - private_images:/data/images
    networks:
      gateway:
        ipv4_address: ${GATEWAY_API_IP:-172.31.254.3}
      database:
    healthcheck:
      test: ["CMD", "python", "-m", "vibicle_api.health"]
      interval: 10s
      timeout: 8s
      retries: 5
      start_period: 10s
    restart: unless-stopped
  caddy:
    image: vibicle-gateway:local
    logging: *service-logging
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    environment:
      VIBICLE_DOMAIN: ${VIBICLE_DOMAIN:?Set VIBICLE_DOMAIN}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in deployment env}
      CADDY_TLS_DIRECTIVE: ${CADDY_TLS_DIRECTIVE:-}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80"
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      gateway:
        ipv4_address: ${GATEWAY_PROXY_IP:-172.31.254.2}
    restart: unless-stopped
networks:
  database:
    internal: true
  gateway:
    ipam:
      config:
        - subnet: ${GATEWAY_SUBNET:-172.31.254.0/28}
volumes:
  postgres_data:
  private_images:
  caddy_data:
  caddy_config:
